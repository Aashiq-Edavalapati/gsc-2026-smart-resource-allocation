<!-- Navigation Bar -->
<div class="flex justify-between items-center p-4 bg-gray-800 text-white shadow-md">
  <h1 class="text-xl font-bold text-white tracking-tight">{{ title() }}</h1>
  
  @if (authService.isLoggedIn()) {
    <div class="flex items-center gap-4">
      <span class="text-gray-300 text-sm font-medium">{{ authService.getCurrentUser()?.email }}</span>
      <button (click)="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-semibold shadow transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-gray-800">
        Logout
      </button>
    </div>
  }
</div>

<!-- Main content where the router injects route views -->
<div class="min-h-[calc(100vh-4rem)]">
  <router-outlet></router-outlet>
</div>
